<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 15px; outline: none; }
        button { width: 100%; padding: 12px; border: none; background: #0284c7; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        .image-box { margin-top: 20px; min-height: 250px; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px dashed #334155; overflow: hidden; }
        img { width: 100%; height: auto; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Image Generator</h1>
        <p>Type a prompt below to generate an AI image!</p>
        <input type="text" id="prompt" placeholder="e.g., A futuristic cyberpunk city at sunset...">
        <button onclick="generateImage()">Generate Image</button>
        <div class="image-box">
            <span id="loading-text" style="color: #64748b;">Your AI image will appear here</span>
            <img id="result-img" alt="Generated AI Image">
        </div>
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const img = document.getElementById('result-img');
            const loading = document.getElementById('loading-text');
            
            if(!prompt) return alert('Please enter a prompt!');
            
            loading.innerText = 'Generating image... Please wait...';
            img.style.display = 'none';

            setTimeout(() => {
                img.src = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=500&height=500&seed=42`;
                img.onload = () => {
                    loading.innerText = '';
                    img.style.display = 'block';
                };
            }, 1000);
        }
    </script>
</body>
</html>
